<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novelistic World | Mirror Hassan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #05070a; color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        .nav { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid #ffcc00; font-weight: bold; font-size: 20px; color: #ffcc00; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { background: #11141d; border-radius: 10px; overflow: hidden; border: 1px solid #333; text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h4 { font-size: 13px; margin: 10px; height: 35px; overflow: hidden; }
        .btn { display: inline-block; background: #ffcc00; color: #000; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }
        footer { text-align: center; padding: 20px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="nav">NOVELISTIC WORLD</div>
    <div class="grid" id="list">Loading...</div>
    <footer>Mirror Hassan Official © 2026</footer>

    <script>
        const ID = '1QAa2IooWSDSCDBKN6CmhTIYVRnKtSfFt54pm70QWyIQ';
        const URL = `https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:json`;

        fetch(URL).then(r => r.text()).then(t => {
            const data = JSON.parse(t.substr(47).slice(0, -2));
            const rows = data.table.rows;
            let html = '';
            rows.forEach((row, i) => {
                if(i===0) return;
                const name = row.c[0] ? row.c[0].v : "Urdu Novel";
                const img = row.c[1] ? row.c[1].v : "https://via.placeholder.com/200";
                const link = row.c[2] ? row.c[2].v : "#";
                html += `<div class="card"><img src="${img}"><h4>${name}</h4><a href="${link}" class="btn" target="_blank">DOWNLOAD</a></div>`;
            });
            document.getElementById('list').innerHTML = html;
        }).catch(e => { document.getElementById('list').innerHTML = "Error: Please Share your Google Sheet as Public."; });
    </script>
</body>
</html>
